<div id="v-dashboard" class="view">
  
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <h2 style="margin:0; font-family:Fraunces; color:var(--green);">Dasbor Bisnis</h2>
    <button class="btn btn-s btn-sm" onclick="exportDashboardCSV()" style="background:#0284c7; color:#fff; border:none;">📥 Export CSV</button>
  </div>

  <!-- HERO: Ringkasan Eksekutif -->
  <div class="hero-card" id="dash-hero"></div>

  <!-- QUICK STATS -->
  <div class="grid" id="dash-stats"></div>

  <!-- CHARTS ROW -->
  <div class="chart-grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
    <div class="card">
      <h3>Omzet per Lini</h3>
      <div class="chart-container">
        <canvas id="chartOmzet"></canvas>
      </div>
    </div>
    <div class="card">
      <h3>Tren Laba Bersih (6 Bulan)</h3>
      <div class="chart-container">
        <canvas id="chartLaba"></canvas>
      </div>
    </div>
    <div class="card">
      <h3>Arus Kas (Masuk vs Keluar)</h3>
      <div class="chart-container">
        <canvas id="chartCashFlow"></canvas>
      </div>
    </div>
    <div class="card">
      <h3>Komposisi Biaya</h3>
      <div class="chart-container">
        <canvas id="chartBiaya"></canvas>
      </div>
    </div>
  </div>

  <!-- BOTTOM ROW -->
  <div class="grid" style="margin-top:16px">
    <div class="card">
      <h3>🔥 Top 5 Barang Terlaris</h3>
      <div id="dash-top-barang"></div>
    </div>
    <div class="card">
      <h3>⚠️ Peringatan Stok Kritis</h3>
      <div id="dash-stok-kritis"></div>
    </div>
  </div>

  <!-- Laporan Lengkap (Collapse) -->
  <details class="card accordion" style="margin-top:16px">
    <summary>📊 Laporan Lengkap (Laba/Rugi & Neraca)</summary>
    <div id="dash-lr" style="margin-top:12px"></div>
    <div id="dash-neraca" style="margin-top:12px"></div>
  </details>
</div>
