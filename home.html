<div id="v-home" class="view">
  
  <!-- Info User -->
  <div id="user-card" class="card" style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
    <div class="ico" id="uc-ico" style="font-size:32px;">🏢</div>
    <div>
      <div style="font-weight:700; font-size:16px;" id="uc-nama">Memuat...</div>
      <div class="hint" style="margin:0" id="uc-info">...</div>
    </div>
  </div>

  <!-- GRID DIVISI -->
  <div class="section-label">PILIH DIVISI USAHA</div>
  <div id="home-div-grid" class="grid" style="grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px;">
    <!-- core.js akan merender 4 kartu divisi ke dalam sini -->
  </div>

  <!-- PENGATURAN SISTEM (Hanya muncul untuk owner) -->
  <div class="section-label" id="sys-label">PENGATURAN SISTEM</div>
  <div class="menu-list" id="sys-menu">
    <div class="menu-card" onclick="openModule('akun')">
      <div class="menu-icon" style="background:#e0e7ff;">👤</div>
      <div class="menu-text">
        <h3>Kelola Akun</h3>
        <p>Buat akun baru, atur PIN, dan batasi akses menu</p>
      </div>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <!-- KESEHATAN DATA -->
  <div class="card" id="kesehatan-card" style="margin-top: 1.5rem; background:#f8fafc; border:1px dashed #cbd5e1;"></div>

  <!-- SECTION BACKUP DATA -->
  <div class="card" style="margin-top: 2rem; background: #f8fafc; border: 1px dashed #cbd5e1;">
    <div class="card-title" style="border-bottom: none; margin-bottom: 0.5rem; color: #475569; font-weight:700;">💾 Backup & Restore Data</div>
    <div class="info-box" style="margin-bottom: 1rem; background: #fffbeb; border-left: 4px solid #f59e0b; padding: 10px; font-size: 12.5px; color: #78350f; border-radius: 4px;">
      Simpan file JSON ini secara berkala. Jika data di aplikasi hilang, kamu bisa memulihkannya dari file ini.
    </div>
    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
      <button class="btn btn-s" onclick="backupAllData()" style="flex: 1;">📥 Backup ke File (.json)</button>
      
      <input type="file" id="restore-file" accept=".json" style="display: none;" onchange="restoreAllData(this)">
      <button class="btn btn-p" onclick="document.getElementById('restore-file').click()" style="flex: 1; background:#0284c7;">📤 Restore dari File</button>
    </div>
  </div>
  
</div>
