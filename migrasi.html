<div id="v-migrasi" class="view">
  <div class="card">
    <div class="card-header-flex">
      <h3>🚀 Migrasi Saldo Awal</h3>
    </div>
    <div class="info-box" style="background: #fef3c7; border-left: 4px solid #f59e0b; padding: 10px; font-size: 12.5px; color: #78350f; border-radius: 4px; margin-bottom: 16px;">
      <b>PENTING:</b> Gunakan form ini HANYA SEKALI saat pertama kali pindah dari Accurate. Masukkan saldo akhir dari Accurate sesuai tanggal cutover (misal 31 Des 2025).
    </div>
    <div class="form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 12px;">
      <div>
        <label>Tanggal Cutover (Saldo Awal)</label>
        <input id="mig-tgl" type="date" value="${today()}">
      </div>
    </div>
    <div id="mig-form"></div>
  </div>
</div>
