<div id="v-pembayaran" class="view">
  <div class="card">
    <div class="card-header-flex">
      <h3>💸 Input Pembayaran</h3>
    </div>
    <div class="form-grid">
      <div>
        <label>Jenis Pembayaran</label>
        <select id="pay-jenis" onchange="payOnJenis()">
          <option value="supplier">Bayar Supplier (Hutang)</option>
          <option value="beban">Beban / Operasional</option>
          <option value="lain">Lain-lain</option>
        </select>
      </div>
      <div>
        <label>ID Pembayaran</label>
        <input id="pay-no" placeholder="PAY-001">
      </div>
      <div>
        <label>Tanggal Bayar</label>
        <input id="pay-tgl" type="date" value="">
      </div>
      <div>
        <label>Supplier / Vendor</label>
        <select id="pay-sup" onchange="payOnSup()">
          <option value="">— Pilih Supplier —</option>
        </select>
      </div>
      <div>
        <label>Metode Bayar</label>
        <select id="pay-metode">
          <option value="cash">💵 Tunai</option>
          <option value="transfer">🏦 Transfer Bank</option>
          <option value="qris">📱 QRIS</option>
          <option value="cek">📄 Cek / Giro</option>
        </select>
      </div>
      <div>
        <label>Akun Kas</label>
        <select id="pay-ent"></select>
      </div>
      <div>
        <label>Total Bayar</label>
        <input id="pay-jml" type="number" value="0" oninput="payOnJml()">
      </div>
      <div>
        <label>Sisa Hutang</label>
        <input id="pay-sisa" readonly value="0" style="background:#f3f4f6">
      </div>
      <div>
        <label>Terbitkan Faktur</label>
        <select id="pay-terbit">
          <option value="0">Tidak</option>
          <option value="1">Ya — kuitansi</option>
        </select>
      </div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div>
        <label>Catatan</label>
        <input id="pay-ket" placeholder="Misal: transfer BCA 15 Jan">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-p" onclick="saveBayar()">💾 Simpan Pembayaran</button>
      <button class="btn btn-s" onclick="openImportDialog('pembayaran')">📥 Import</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header-flex">
      <h3>10 Transaksi Terakhir <span class="badge-count" id="bayar-count">0</span></h3>
    </div>
    <div id="pembayaran-list"></div>
  </div>
</div>
